<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="A blog platform with AI-powered writing help for discovering and sharing thoughtful articles."
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;900&display=swap"
      rel="stylesheet"
    />
    <title>Blog Platform</title>
    <script>
      (() => {
        try {
          const savedTheme = localStorage.getItem("theme");
          const prefersDark = window.matchMedia?.("(prefers-color-scheme: dark)").matches;
          document.documentElement.classList.toggle(
            "dark",
            savedTheme === "dark" || (savedTheme !== "light" && prefersDark),
          );
        } catch (error) {
          document.documentElement.classList.toggle(
            "dark",
            window.matchMedia?.("(prefers-color-scheme: dark)").matches,
          );
        }
      })();
    </script>
  </head>
  <body class="bg-gray-50 text-gray-900 min-h-screen antialiased dark:bg-gray-900 dark:text-gray-100">
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
